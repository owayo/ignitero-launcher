name: CI

on:
  push:
  pull_request:

env:
  # mise.lock に記録した URL と checksum でのみツールを取得し、lock の書き換えも禁じる。
  MISE_LOCKED: "1"

jobs:
  build:
    # Package.swift の platforms: [.macOS(.v26)] と Xcode 26 / Swift 6.3 系 (macOS 26 SDK)
    # に揃えるため macos-26 ランナーを使用する。
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify Xcode and Swift
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: ${sdk_version}"
          [[ "${sdk_version}" == 26.* ]]

      - name: Setup tools (mise)
        # Python の版は mise.toml が正。Swift は Xcode のものを使う (mise では管理しない)。
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d   # mise 本体は公開から 14 日以上たった最新の版
          cache: false               # 毎回 mise.lock の checksum で検証して取得する

      - name: Generate emoji keywords
        run: python3 scripts/update_emoji_keywords.py

      - name: Test Python scripts
        # scripts/tests の単体テスト。ネットワークには出ない。
        run: python3 -m unittest discover -v -s scripts/tests

      - name: Build native libraries
        run: IGNITERO_NATIVE_TESTS=1 make native

      - name: Prepare verified OCR model
        run: make setup-ocr-models OCRUS_MODEL_DIR="$RUNNER_TEMP/ocr-models"

      - name: Prepare verified provider logos
        # 第三者のロゴはリポジトリに入れず、lock の SHA-256 と照合して取得する。
        # 後の make smoke-resources (bundle) は、このキャッシュを照合し直して .app に置く。
        run: make setup-provider-logos PROVIDER_LOGO_CACHE_DIR="$RUNNER_TEMP/provider-logos"

      - name: Build
        # Swift 6.3 系の release 最適化で KeyboardShortcuts の SIL シリアライズが
        # crash するため、Makefile と同様に -Onone を付与して回避する。
        run: swift build -c release -Xswiftc -Onone

      - name: Test
        run: swift test

      - name: Test OCR range selection UI
        run: IGNITERO_OCR_UI=1 swift test --filter OCRSelectionUITests

      - name: Verify packaged resource resolution
        # `.app` にリソースバンドルを入れ忘れても、開発マシンでは `Bundle.module` が
        # ビルドディレクトリの絶対パスで偶然解決できてしまうため、配布物でだけ
        # クラッシュする形で現れる (2026-09-01 に絵文字検索で発生)。
        # `.build` の `.bundle` を退避した状態で `.app` の自己診断を走らせて検出する。
        run: make smoke-resources OCRUS_MODEL_DIR="$RUNNER_TEMP/ocr-models" PROVIDER_LOGO_CACHE_DIR="$RUNNER_TEMP/provider-logos"
