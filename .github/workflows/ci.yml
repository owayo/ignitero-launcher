name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.4'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate emoji keywords
        run: python3 scripts/update_emoji_keywords.py

      - name: Build
        # Swift 6.2/6.3 系の release 最適化で KeyboardShortcuts の SIL シリアライズが
        # crash するため、Makefile と同様に -Onone を付与して回避する。
        run: swift build -c release -Xswiftc -Onone
